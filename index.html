<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tag2u — Lost stuff, found fast</title><link rel="stylesheet" href="style.css"><script src="config.js"></script></head>
<body><main>
<h1>Tag2u</h1><p class="sub">Lost stuff, found fast — no strangers, no fuss.</p>

<section id="home" class="home">
  <button onclick="go('own')">I own a tag</button>
  <button class="alt" onclick="go('found')">I found something</button>
</section>

<section id="own" class="hide">
  <button class="alt" onclick="go('home')">← Back</button>
  <form class="card" id="form">
    <b>Activate your tag(s)</b>
    <label>Tag ID(s) <span class="hint">— on the tag. Got a bag? Put all the IDs in, separated by spaces or new lines.</span></label>
    <textarea id="ids" rows="2" required placeholder="T2U-AB12CD"></textarea>
    <label>Your name</label><input id="name" required maxlength="60">
    <label>Phone number (optional)</label><input id="phone" type="tel" maxlength="30">
    <label>Email <span class="hint">— we email you here when someone finds your item (parent/guardian email recommended)</span></label><input id="email" type="email" maxlength="80" required>
    <label>School (optional)</label><input id="school" maxlength="80">
    <label>What's this tag on? (optional)</label><input id="item" maxlength="80" placeholder="e.g. Blue school bag">
    <label>What should finders see?</label>
    <select id="show"><option value="yes">My phone/email (fastest)</option><option value="no">Nothing — they can only send me a message</option></select>
    <button>Activate</button>
    <div id="saved" class="hint hide">Your details were filled in from your last tag. <a href="#" onclick="clearSaved();return false">Clear saved details</a></div>
    <div id="ownmsg"></div>
  </form>
</section>

<section id="found" class="hide">
  <button class="alt" onclick="go('home')">← Back</button>
  <div class="card">
    <label>Tag ID on the item</label><input id="fid" placeholder="T2U-AB12CD">
    <button onclick="lookup()">Look up this tag</button>
  </div>
  <div id="result"></div>
  <form class="card hide" id="msgbox">
    <b>Send the owner a message</b>
    <label>Where did you find it?</label>
    <select id="where"><option>School office / reception</option><option>PE department / changing rooms</option><option>Classroom / corridor</option><option>Bus / transport</option><option>Somewhere else</option></select>
    <label>Message</label><textarea id="note" rows="3" maxlength="500"></textarea>
    <label>Your contact (optional)</label><input id="from" maxlength="80">
    <button>Notify the owner</button><div id="sendmsg"></div>
  </form>
</section>
</main>
<script>
const C=window.TAG2U,$=id=>document.getElementById(id),norm=s=>s.toUpperCase().replace(/[^A-Z0-9-]/g,'');
const F=['name','phone','email','school','item','show'];
function go(v){['home','own','found'].forEach(s=>$(s).classList.toggle('hide',s!=v));if(v=='own')loadSaved()}
async function api(action,d){
  if(!C.API_URL){ // demo mode: browser only
    const db=JSON.parse(localStorage.t2u_db||'{}');
    if(action=='lookup'){const t=db[d.tagId];return t?{found:true,...t,phone:t.show=='yes'?t.phone:'',email:t.show=='yes'?t.email:''}:{found:false}}
    if(action=='activate'){const results=d.tagIds.map(id=>{if(db[id])return{id,ok:false};db[id]={name:d.name,phone:d.phone,email:d.email,school:d.school,item:d.item,show:d.show};return{id,ok:true}});localStorage.t2u_db=JSON.stringify(db);return{ok:true,results}}
    return{ok:true}}
  const r=await fetch(C.API_URL,{method:'POST',body:JSON.stringify({action,...d})});return r.json()}
function loadSaved(){const s=JSON.parse(localStorage.t2u_owner||'null');if(!s)return;F.forEach(k=>$(k).value=s[k]||$(k).value);$('saved').classList.remove('hide')}
function clearSaved(){localStorage.removeItem('t2u_owner');F.forEach(k=>$(k).value=k=='show'?'yes':'');$('saved').classList.add('hide')}
$('form').onsubmit=async e=>{e.preventDefault();const o=$('ownmsg');
  const tagIds=[...new Set($('ids').value.split(/[\s,;]+/).map(norm).filter(x=>x.length>=4))];
  if(!tagIds.length)return o.innerHTML='<div class="msg err">Enter a valid tag ID.</div>';
  if(!$('email').value.trim())return o.innerHTML='<div class="msg err">Add an email so we can notify you.</div>';
  const d={tagIds};F.forEach(k=>d[k]=$(k).value.trim());o.textContent='Saving…';
  try{const r=await api('activate',d);if(!r.ok)throw 0;
    const good=r.results.filter(x=>x.ok).map(x=>x.id),bad=r.results.filter(x=>!x.ok).map(x=>x.id);
    o.innerHTML='';const m=document.createElement('div');m.className='msg '+(good.length?'ok':'err');
    m.textContent=(good.length?'Activated: '+good.join(', ')+'. ':'')+(bad.length?'Already activated or invalid: '+bad.join(', ')+'.':'');o.append(m);
    if(good.length){const s={};F.forEach(k=>s[k]=d[k]);localStorage.t2u_owner=JSON.stringify(s);$('ids').value='';
      const h=document.createElement('p');h.className='hint';h.textContent='More tags? Scan the next one (or type its ID) — your details are saved, so only the ID changes.';o.append(h)}
  }catch(_){o.innerHTML='<div class="msg err">Something went wrong. Try again.</div>'}};
function el(t,txt,cls,href){const x=document.createElement(t);x.textContent=txt;if(cls)x.className=cls;if(href)x.href=href;return x}
async function lookup(){const id=norm($('fid').value),o=$('result');o.textContent='Looking…';$('msgbox').classList.add('hide');
  try{const d=await api('lookup',{tagId:id});o.innerHTML='';if(d.found)['name','school','item','phone','email'].forEach(k=>d[k]=String(d[k]??'').trim());
    if(!d.found){o.append(el('div','This tag isn\'t activated yet. If it\'s yours, activate it now.','msg err'));
      const b=el('button','Activate it');b.onclick=()=>{$('ids').value=id;go('own')};return o.append(b)}
    const c=el('div','','card');c.append(el('h3',(d.name||'Someone')+' owns this'));
    if(d.item)c.append(el('div','Item: '+d.item));if(d.school)c.append(el('div','School: '+d.school));
    if(d.phone)c.append(el('a','📞 Call '+d.phone,'btn','tel:'+d.phone.replace(/[^0-9+]/g,'')));
    if(d.email)c.append(el('a','✉️ Email '+d.email,'btn alt','mailto:'+encodeURI(d.email)));
    if(!d.phone&&!d.email)c.append(el('p','The owner prefers messages — use the form below.','hint'));
    o.append(c);$('msgbox').classList.remove('hide');
  }catch(err){o.innerHTML='';o.append(el('div','Couldn\'t look that up. ('+err+')','msg err'))}}
$('msgbox').onsubmit=async e=>{e.preventDefault();const o=$('sendmsg');o.textContent='Sending…';
  try{const r=await api('message',{tagId:norm($('fid').value),where:$('where').value,note:$('note').value,from:$('from').value});
    o.innerHTML=r.ok?'<div class="msg ok">Sent — thank you!</div>':'<div class="msg err">Couldn\'t send.</div>'}catch(_){o.innerHTML='<div class="msg err">Couldn\'t send.</div>'}};
const q=new URLSearchParams(location.search).get('t');
if(q){go('found');$('fid').value=norm(q);lookup()}else go('home');
</script></body></html>
